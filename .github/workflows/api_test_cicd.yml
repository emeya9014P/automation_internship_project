name: API Test Automation CI/CD

# main 브랜치에 push 되거나 Pull Request가 올 때 실행
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. 깃허브 저장소 코드 가져오기
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. 파이썬 환경 설정 (3.10 버전)
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. 필요한 라이브러리 전체 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests behave selenium webdriver-manager

    # 4. Behave API 테스트 실행
    - name: Run Behave API Tests
      run: |
        behave features/api_test.feature
