name: Run Behave Tests with Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install allure-behave

    # 1. Behave API 테스트 실행 및 Allure 결과 수집
    - name: Run Behave API Tests
      env:
        PYTHONPATH: .
      run: |
        behave -f allure_behave.formatter:AllureFormatter -o allure-results features/api_test.feature
      continue-on-error: true

    # 2. Allure Report 생성 및 히스토리 관리
    - name: Get Allure Report history & Publish
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    # 3. gh-pages 브랜치로 리포트 파일 푸시 (GitHub Pages 발행)
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history